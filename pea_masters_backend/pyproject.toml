[project]
name = "pea-backend"
version = "0.1.0"
description = "PEA portal API (FastAPI + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "authlib",
    "itsdangerous",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-playwright>=0.10.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests/api"]  # browser tests run on their own: uv run pytest tests/e2e
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is intended

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # SQL is easier to read unwrapped
