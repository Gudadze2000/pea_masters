services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pea
      POSTGRES_PASSWORD: pea # local development only
      POSTGRES_DB: pea
    ports:
      - "127.0.0.1:5434:5432" # 5434 on your PC, so it never clashes with another PostgreSQL install
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro # creates the pea_test database on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pea -d pea"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
